# Publishes landing-page/ to GitHub Pages (https://nikhilpanwar.github.io/Hefty/).
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Landing page

on:
  push:
    branches: [main]
    paths: ["landing-page/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (without the generator sources)
        run: rsync -a --exclude _src landing-page/ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
